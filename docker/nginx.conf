# nginx configuration of the offline marketplace image (Dockerfile): the
# bundle is a folder of static files, served on port 8080 without root rights.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  # Files are revalidated on every request (nginx answers 304 when nothing
  # changed), so iHub's registry refresh and a browser see a new bundle at once.
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json text/css application/javascript text/plain text/markdown image/svg+xml;

  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }

  # Plain text where the file type is not known to nginx, so a browser shows
  # the license and the guide instead of downloading them
  location = /LICENSE {
    default_type text/plain;
  }
  location ~* \.md$ {
    default_type text/plain;
  }

  # For the container health check and load balancers
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ /\. {
    return 404;
  }
}
