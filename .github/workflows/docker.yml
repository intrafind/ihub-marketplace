name: Offline Marketplace

# Builds the offline marketplace for installations without internet access
# (docs/offline.md) in the two forms it is delivered in:
#
#   - the container image (Dockerfile): an nginx serving the bundle. Pull
#     requests build it and test it; main publishes it to the GitHub Container
#     Registry as ghcr.io/<owner>/ihub-marketplace (tags `latest` and
#     `sha-<commit>`), for linux/amd64 and linux/arm64. Only main publishes:
#     a manual run on another branch builds and tests, and stops there.
#   - the bundle itself, a .tar.gz with its .sha256 (scripts/build-offline.sh),
#     kept as a workflow artifact for hosting on any web server.
#
# The image is also rebuilt every week, so that it picks up the security
# updates of its nginx base image even when the catalog did not change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ihub-marketplace

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Full history with the tags: build-site.sh publishes the released
      # versions of the integrations from them
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Test the catalog scripts
        run: node --test scripts/test/*.test.js

      - name: Build the offline bundle
        run: ./scripts/build-offline.sh

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ihub-marketplace-offline
          path: |
            _offline/*.tar.gz
            _offline/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # What is published must be what was tested: the same build, loaded into
      # the runner's Docker, is started and every file of the catalog requested
      - name: Build the image for the test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ihub-marketplace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        run: |
          docker run -d --name marketplace -p 8080:8080 ihub-marketplace:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          node scripts/check-served-bundle.js http://127.0.0.1:8080/
          # Runs without root rights
          test "$(docker exec marketplace id -u)" != 0
          docker rm -f marketplace

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe the image
        id: meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Publish the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
