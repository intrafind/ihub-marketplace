name: Offline Marketplace

# Builds the offline marketplace for installations without internet access
# (docs/offline.md) and releases it.
#
# Every pull request that is merged to main is a release. Its version is the
# UTC time of the run, yyyymmddhhmm (for example 202611032031), and the release
# is tagged with it:
#
#   - the container image (Dockerfile), an nginx serving the bundle, is
#     published to the GitHub Container Registry as
#     ghcr.io/<owner>/ihub-marketplace:<version> (also `latest` and
#     `sha-<commit>`), for linux/amd64 and linux/arm64;
#   - the bundle itself, a .tar.gz with its .sha256 (scripts/build-offline.sh),
#     is attached to the GitHub release <version>.
#
# Pull requests build and test both and publish nothing; the bundle is a
# workflow artifact there. A manual run on another branch does the same.
#
# The image is also rebuilt every week, so that it picks up the security
# updates of its nginx base image even when the catalog did not change; that
# run is a release of its own.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Runs on main queue up one after the other, so a release finds the tag of the
# one before it
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release version. Only a run that releases (main) has one.
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the UTC time as the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Whether the tag exists: a 404 means it does not, anything else is an error
          tag_exists() {
            if output="$(gh api "repos/$REPO/git/ref/tags/$1" 2>&1)"; then
              return 0
            fi
            case "$output" in
              *"Not Found"*) return 1 ;;
              *) echo "$output" >&2; exit 1 ;;
            esac
          }
          version="$(date -u +%Y%m%d%H%M)"
          # A release in the same minute: take the next free minute
          while tag_exists "$version"; do
            version="$(date -u -d "${version:0:8} ${version:8:2}:${version:10:2} UTC + 1 minute" +%Y%m%d%H%M)"
          done
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bundle:
    needs: version
    # The version job is skipped on pull requests; the build is not
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Full history with the tags: build-site.sh publishes the released
      # versions of the integrations from them
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Test the catalog scripts
        run: node --test scripts/test/*.test.js

      - name: Build the offline bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/build-offline.sh ${VERSION:+--version "$VERSION"}

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: ihub-marketplace-offline
          path: |
            _offline/*.tar.gz
            _offline/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  image:
    needs: version
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # What is published must be what was tested: the image is built once
      # for the test, started, and every file of its catalog requested
      - name: Build the image for the test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: docker build --tag ihub-marketplace:ci ${VERSION:+--build-arg "VERSION=$VERSION"} .

      - name: Test the image
        run: |
          docker run -d --name marketplace -p 8080:8080 ihub-marketplace:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          node scripts/check-served-bundle.js http://127.0.0.1:8080/
          # Runs without root rights
          test "$(docker exec marketplace id -u)" != 0
          docker rm -f marketplace

      # The Docker CLI of the runner, no third-party actions: the multi-
      # architecture build runs in a buildx builder (the bundle stage of the
      # Dockerfile always runs natively, so nothing is emulated)
      - name: Publish the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/ihub-marketplace"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            --tag "$image:sha-${GITHUB_SHA::7}" \
            --push .

  # The GitHub release: the tag <version> on this commit, the bundle as its
  # assets, and what was merged since the release before as its notes. Last, so
  # that a release exists only for a version whose image was published.
  release:
    needs: [version, bundle, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: ihub-marketplace-offline
          path: assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/ihub-marketplace"
          {
            printf 'Offline marketplace `%s` (UTC build time, yyyymmddhhmm).\n\n' "$VERSION"
            printf -- '- **Docker image:** `%s:%s`\n' "$image" "$VERSION"
            printf -- '- **Bundle:** `ihub-marketplace-offline-%s.tar.gz` below, with its `.sha256` file\n\n' "$VERSION"
            printf 'Hosting it and adding it to iHub: [docs/offline.md](https://github.com/%s/blob/%s/docs/offline.md)\n' "$REPO" "$GITHUB_SHA"
          } > notes.md
          gh release create "$VERSION" assets/* \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest
