name: Marketplace Website

# Tests the catalog scripts, builds the marketplace website (site/ +
# catalog.json + content folders) and publishes it to GitHub Pages. Pull
# requests only test and build, so a broken catalog reference or an
# integration change without its version bump or migration fails the check
# before it reaches main.
#
# On main, every integration version that is not tagged yet gets its release
# tag `integrations/<id>@<version>` first (scripts/tag-integrations.js), and the
# build publishes every tagged version under versions/ with `versions` on the
# catalog item (scripts/build-versions.js), so iHub can install a pinned
# version and revert to an intermediate one.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a running Pages deployment; superseded PR builds can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release tags for the integration versions that reached main. Only on main:
  # it needs write access to push the tags.
  tag:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag integration releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          node scripts/tag-integrations.js --push

  build:
    needs: tag
    # After the tags on main; on its own for pull requests, where the tag job is skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Full history with the tags: validate.js compares every integration
      # folder with its previous release tag (or with main for a definition
      # that was never released: a changed folder needs a version bump, a
      # removed install field or action a migration), and build-versions.js
      # exports every tagged version from git.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Test the catalog scripts
        run: node --test scripts/test/*.test.js

      - name: Build website
        run: ./scripts/build-site.sh _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
