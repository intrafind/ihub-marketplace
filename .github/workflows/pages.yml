name: Marketplace Website

# Tests the catalog scripts, builds the marketplace website (site/ +
# catalog.json + content folders) and publishes it to GitHub Pages. Pull
# requests only test and build, so a broken catalog reference or an
# integration change without its version bump or migration fails the check
# before it reaches main.
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a running Pages deployment; superseded PR builds can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # validate.js compares every integration folder with main (a changed
      # folder needs a version bump, a removed install field or action a
      # migration). A pull request checkout holds only the merge commit, so
      # fetch main next to it; without it those checks are skipped.
      - name: Fetch main for the integration checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Test the catalog scripts
        run: node --test scripts/test/*.test.js

      - name: Build website
        run: ./scripts/build-site.sh _site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
