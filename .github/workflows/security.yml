# Security checks on pull requests, pushes to main and once a week.
#
# The catalog is installed into every iHub that uses the marketplace, so this
# repository is part of iHub's supply chain: a leaked token or a compromised
# workflow here reaches customer installations.
#
# - Secret scan: gitleaks over the commits a pull request (or push) adds. Fails
#   the check. A false positive gets a `gitleaks:allow` comment on its line.
# - zizmor: security audit of the GitHub Actions workflows (template injection,
#   unpinned actions, credential persistence, permissions). Reports to the
#   Security tab, or as annotations on pull requests from forks.
# - Trivy (config): the Dockerfile and the nginx image it builds (root user,
#   missing health check, secrets in layers). Reports to the Security tab.
#
# Scorecard runs in scorecard.yml (it has workflow restrictions of its own).

name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
      # release's checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # A new branch has no "before" commit; scan just the pushed head.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="-1 ${PUSH_AFTER}"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *) range="-1 HEAD" ;;
          esac
          echo "Scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="$range" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 || {
            {
              echo "### Secret scan failed"
              echo
              echo "gitleaks found a possible secret in the commits above (values are redacted in the log)."
              echo
              echo "- **Real secret:** rotate it now. Deleting it from the branch does not remove it from git history."
              echo "- **False positive:** add a \`gitleaks:allow\` comment on that line."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        # In annotation mode (fork PRs) zizmor exits non-zero on findings;
        # the scan stays report-only, as it is with SARIF upload.
        continue-on-error: ${{ env.FORK_PR == 'true' }}
        with:
          version: 1.30.1
          advanced-security: ${{ env.FORK_PR != 'true' }}
          annotations: ${{ env.FORK_PR == 'true' }}

  trivy-config:
    name: Trivy (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan infrastructure as code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload results to code scanning
        if: always() && env.FORK_PR != 'true' && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
